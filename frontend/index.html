<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div id="auth-container">
            <div id="login-form" class="form-container">
                <h1>Login</h1>
                <form id="login" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-email">Email:</label>
                        <input 
                            type="email" 
                            id="login-email" 
                            name="email" 
                            required
                            placeholder="Enter your email"
                        >
                        <span class="error" id="login-email-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password:</label>
                        <input 
                            type="password" 
                            id="login-password" 
                            name="password" 
                            required
                            placeholder="Enter your password"
                        >
                        <span class="error" id="login-password-error"></span>
                    </div>
                    <button type="submit" class="btn">Login</button>
                    <p class="toggle-text">
                        Don't have an account? <a href="#" onclick="toggleForms(event)">Register</a>
                    </p>
                </form>
                <div id="login-message" class="message"></div>
            </div>

            <div id="register-form" class="form-container" style="display: none;">
                <h1>Register</h1>
                <form id="register" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="register-email">Email:</label>
                        <input 
                            type="email" 
                            id="register-email" 
                            name="email" 
                            required
                            placeholder="Enter your email"
                        >
                        <span class="error" id="register-email-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="register-username">Username:</label>
                        <input 
                            type="text" 
                            id="register-username" 
                            name="username" 
                            required
                            minlength="3"
                            placeholder="Enter your username"
                        >
                        <span class="error" id="register-username-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password:</label>
                        <input 
                            type="password" 
                            id="register-password" 
                            name="password" 
                            required
                            minlength="8"
                            placeholder="Enter a password (min 8 characters)"
                        >
                        <span class="error" id="register-password-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="register-confirm-password">Confirm Password:</label>
                        <input 
                            type="password" 
                            id="register-confirm-password" 
                            name="confirm_password" 
                            required
                            placeholder="Confirm your password"
                        >
                        <span class="error" id="register-confirm-password-error"></span>
                    </div>
                    <button type="submit" class="btn">Register</button>
                    <p class="toggle-text">
                        Already have an account? <a href="#" onclick="toggleForms(event)">Login</a>
                    </p>
                </form>
                <div id="register-message" class="message"></div>
            </div>
        </div>

        <div id="dashboard" style="display: none;">
            <div class="dashboard-container">
                <h1>Calculation Dashboard</h1>
                <div id="user-info" class="user-info"></div>

                <!-- Create Calculation Form -->
                <div class="calculation-section">
                    <h2>Create Calculation</h2>
                    <form id="create-calc-form" onsubmit="handleCreateCalculation(event)">
                        <div class="form-group">
                            <label for="operation">Operation:</label>
                            <select id="operation" name="operation" required>
                                <option value="">Select an operation</option>
                                <option value="add">Add</option>
                                <option value="subtract">Subtract</option>
                                <option value="multiply">Multiply</option>
                                <option value="divide">Divide</option>
                            </select>
                            <span class="error" id="operation-error"></span>
                        </div>
                        <div class="form-group">
                            <label for="operand1">First Operand:</label>
                            <input 
                                type="number" 
                                id="operand1" 
                                name="operand1" 
                                required
                                step="any"
                                placeholder="Enter first number"
                            >
                            <span class="error" id="operand1-error"></span>
                        </div>
                        <div class="form-group">
                            <label for="operand2">Second Operand:</label>
                            <input 
                                type="number" 
                                id="operand2" 
                                name="operand2" 
                                required
                                step="any"
                                placeholder="Enter second number"
                            >
                            <span class="error" id="operand2-error"></span>
                        </div>
                        <button type="submit" class="btn">Create Calculation</button>
                    </form>
                    <div id="create-calc-message" class="message"></div>
                </div>

                <!-- Browse Calculations -->
                <div class="calculation-section">
                    <h2>Your Calculations</h2>
                    <div id="calculations-list" class="calculations-list">
                        <p>Loading calculations...</p>
                    </div>
                    <button onclick="refreshCalculations()" class="btn">Refresh</button>
                </div>

                <!-- Edit/View Calculation Modal -->
                <div id="edit-calc-modal" class="modal" style="display: none;">
                    <div class="modal-content">
                        <span class="close" onclick="closeEditModal()">&times;</span>
                        <h2>Update Calculation</h2>
                        <form id="edit-calc-form" onsubmit="handleUpdateCalculation(event)">
                            <div class="form-group">
                                <label for="edit-operation">Operation:</label>
                                <select id="edit-operation" name="operation">
                                    <option value="">No change</option>
                                    <option value="add">Add</option>
                                    <option value="subtract">Subtract</option>
                                    <option value="multiply">Multiply</option>
                                    <option value="divide">Divide</option>
                                </select>
                                <span class="error" id="edit-operation-error"></span>
                            </div>
                            <div class="form-group">
                                <label for="edit-operand1">First Operand:</label>
                                <input 
                                    type="number" 
                                    id="edit-operand1" 
                                    name="operand1"
                                    step="any"
                                    placeholder="Leave empty for no change"
                                >
                                <span class="error" id="edit-operand1-error"></span>
                            </div>
                            <div class="form-group">
                                <label for="edit-operand2">Second Operand:</label>
                                <input 
                                    type="number" 
                                    id="edit-operand2" 
                                    name="operand2"
                                    step="any"
                                    placeholder="Leave empty for no change"
                                >
                                <span class="error" id="edit-operand2-error"></span>
                            </div>
                            <div id="edit-calc-result" class="calculation-result"></div>
                            <button type="submit" class="btn">Update Calculation</button>
                        </form>
                        <div id="edit-calc-message" class="message"></div>
                    </div>
                </div>

                <button onclick="logout()" class="btn btn-logout">Logout</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
